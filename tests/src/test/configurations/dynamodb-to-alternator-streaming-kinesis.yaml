# Reference YAML for replicating live changes from a DynamoDB source to ScyllaDB Alternator
# using a Kinesis Data Stream as the source of change events (instead of DynamoDB Streams).
#
# To use this locally you need an environment that supports both the
# `EnableKinesisStreamingDestination` DynamoDB API and Kinesis itself -- LocalStack Pro works,
# the community edition does not expose the Kinesis-destination DDB API.
#
# This file is primarily kept here as an example / integration-test fixture; the unit tests in
# `StreamChangesSettingParserTest` and `KinesisJsonDeserializerTest` already validate the
# code paths without infrastructure.
source:
  type: dynamodb
  table: StreamedItemsKinesisTest
  region: us-east-1

target:
  type: dynamodb
  table: StreamedItemsKinesisTest
  region: dummy
  endpoint:
    host: http://scylla
    port: 8000
  credentials:
    accessKey: dummy
    secretKey: dummy
  streamChanges:
    type: kinesis
    # Replace with the real Kinesis Data Stream ARN created for the source table.
    streamArn: arn:aws:kinesis:us-east-1:000000000000:stream/StreamedItemsKinesisTest
    # Optional: if omitted, the migrator defaults to the snapshot start time so no writes are
    # missed while the initial snapshot is running.
    # initialTimestamp: "2026-04-01T00:00:00Z"
    # Optional: override the KCL lease/checkpoint application name (and the DDB table it owns).
    # appName: my-kinesis-migrator
  removeConsumedCapacity: true
  billingMode: PAY_PER_REQUEST

savepoints:
  path: /app/savepoints
  intervalSeconds: 300
